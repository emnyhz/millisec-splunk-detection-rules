name: Deploy Detection Rules to Splunk

on:
  push:
    branches:
      - main
    paths:
      - "rules/**"
      - "scripts/**"
      - ".github/workflows/deploy-to-splunk.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splunk-detection-rule-deployment
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and Synchronize Rules
    runs-on:
      - self-hosted
      - Linux
      - X64
      - splunk
      - siem

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML requests

      - name: Validate rule count and YAML syntax
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob("rules/**/*.yml", recursive=True))

          print(f"Detection rules found: {len(files)}")

          if len(files) != 15:
              print("ERROR: Exactly 15 detection rules are required.")
              sys.exit(1)

          required = {
              "title",
              "id",
              "status",
              "version",
              "author",
              "description",
              "severity",
              "data_source",
              "mitre_attack",
              "splunk",
              "search",
              "false_positives",
              "investigation",
              "response",
          }

          ids = set()

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  rule = yaml.safe_load(f)

              missing = required - set(rule.keys())

              if missing:
                  print(f"ERROR: {path} missing fields: {sorted(missing)}")
                  sys.exit(1)

              rule_id = rule["id"]

              if rule_id in ids:
                  print(f"ERROR: Duplicate rule ID: {rule_id}")
                  sys.exit(1)

              ids.add(rule_id)
              print(f"[VALID] {rule_id} - {rule['title']}")

          print("All 15 detection rules passed validation.")
          PY

      - name: Deploy rules through Splunk REST API
        env:
          SPLUNK_URL: https://127.0.0.1:8089
          SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
        run: |
          python scripts/deploy_rules.py
