title: Path Traversal and Local File Inclusion Detection
id: MS-WEB-003
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Detects filesystem traversal and local file inclusion attempts using relative-path sequences, encoded traversal characters and sensitive operating-system file references.
severity: high
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Initial Access
  technique:
  - T1190
  technique_name:
  - Exploit Public-Facing Application
splunk:
  name: MilliSec - Path Traversal LFI Detection
  schedule: '*/1 * * * *'
  earliest_time: -2m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 60
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | eval decoded_uri=lower(urldecode(uri))
  | where match(decoded_uri,"\\.\\./|\\.\\.\\\\|%2e%2e|/etc/passwd|/etc/shadow|windows/win\\.ini|boot\\.ini|proc/self/environ")
  | eval detection="Path Traversal or LFI Attempt", rule_id="MS-WEB-003", severity="high"
  | table _time rule_id detection severity src_ip method uri status user_agent
false_positives:
- Authorized vulnerability scanning
- Application routes intentionally containing relative path examples
investigation:
- Review requested paths and target parameters
- Check response codes and response sizes
- Determine whether sensitive file content may have been returned
- Correlate with command-injection activity from the same source
response:
- Block confirmed malicious requests
- Restrict application filesystem access
- Normalize and validate path input
- Escalate suspected sensitive-file disclosure
