title: Sensitive File and Secret Exposure Scan Detection
id: MS-WEB-006
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Detects requests for exposed configuration files, source-control metadata, environment files, backups and administrative interfaces frequently targeted during web exploitation.
severity: medium
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Discovery
  technique:
  - T1083
  technique_name:
  - File and Directory Discovery
splunk:
  name: MilliSec - Sensitive File Scan Detection
  schedule: '*/1 * * * *'
  earliest_time: -2m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 120
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | eval decoded_uri=lower(urldecode(uri))
  | where match(decoded_uri,"/\\.env($|\\?)|/\\.git/|/\\.svn/|wp-config\\.php|config\\.(json|yml|yaml|php)|backup\\.(zip|tar|gz|sql)|/phpmyadmin|/server-status|/actuator/env|/debug")
  | eval detection="Sensitive File or Secret Exposure Scan", rule_id="MS-WEB-006", severity="medium"
  | table _time rule_id detection severity src_ip method uri status user_agent
false_positives:
- Internal health checks
- Authorized vulnerability assessment
investigation:
- Review requested resources and response status
- Confirm whether the resource exists
- Check for secret or repository-metadata exposure
- Review other requests from the same source
response:
- Remove publicly exposed sensitive resources
- Deny access to administrative and hidden files
- Rotate exposed credentials
- Block repeat malicious scanners
