title: Path Traversal and Local File Inclusion Detection
id: MS-WEB-003
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects attempts to traverse the local filesystem or access sensitive
  operating system files through crafted HTTP request paths and parameters.

severity: high

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Initial Access
  technique:
    - T1190
  technique_name:
    - Exploit Public-Facing Application

splunk:
  name: MilliSec - Path Traversal LFI Detection
  schedule: "*/1 * * * *"
  earliest_time: "-2m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 60

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | eval decoded_uri=lower(urldecode(uri))
  | where match(decoded_uri,"\.\./|\.\.\\|%2e%2e|/etc/passwd|/etc/shadow|windows/win\.ini|boot\.ini|proc/self/environ")
  | eval detection="Path Traversal or LFI Attempt"
  | eval rule_id="MS-WEB-003"
  | eval severity="high"
  | table _time rule_id detection severity src_ip method uri status user_agent

false_positives:
  - Authorized penetration testing
  - Approved vulnerability scanning
  - Application routes containing legitimate relative path values

investigation:
  - Review the complete requested path and parameters
  - Check whether the requested file exists on the target system
  - Review HTTP response status and response size
  - Correlate the source with reconnaissance and command injection activity

response:
  - Block confirmed malicious source addresses
  - Restrict filesystem access from the web application
  - Validate and normalize user-controlled file paths
  - Escalate confirmed sensitive file disclosure
