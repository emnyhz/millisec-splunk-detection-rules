title: Advanced Cross-Site Scripting Detection
id: MS-WEB-002
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects Cross-Site Scripting attempts in HTTP requests by identifying
  encoded and decoded script tags, JavaScript URI handlers, HTML event
  handlers and common browser-side execution payloads.

severity: high

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Initial Access
  technique:
    - T1190
  technique_name:
    - Exploit Public-Facing Application

splunk:
  name: MilliSec - Advanced XSS Detection
  schedule: "*/1 * * * *"
  earliest_time: "-2m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 60

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | eval decoded_uri=lower(urldecode(uri))
  | where match(decoded_uri,"<script|javascript:|onerror\s*=|onload\s*=|document\.cookie|alert\s*\(|<svg|<iframe|%3cscript")
  | eval detection="Cross-Site Scripting Attempt"
  | eval rule_id="MS-WEB-002"
  | eval severity="high"
  | table _time rule_id detection severity src_ip method uri status user_agent

false_positives:
  - Authorized penetration testing
  - Approved web application security scanning
  - Requests containing JavaScript examples as legitimate text

investigation:
  - Review the complete request URI and submitted parameters
  - Check whether the payload reached a vulnerable application endpoint
  - Correlate the source IP with other web attack detections
  - Review application logs for evidence of reflected or stored payload execution

response:
  - Block confirmed malicious source addresses
  - Review input validation and contextual output encoding
  - Validate Content Security Policy configuration
  - Escalate confirmed script execution to incident response
