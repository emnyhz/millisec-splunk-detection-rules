title: Command Injection and Remote Code Execution Detection
id: MS-WEB-004
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects suspicious shell metacharacters, command chaining, command
  substitution and operating system command execution patterns in HTTP
  request parameters that may indicate command injection or remote code
  execution attempts.

severity: critical

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Execution
  technique:
    - T1059
  technique_name:
    - Command and Scripting Interpreter

splunk:
  name: MilliSec - Command Injection RCE Detection
  schedule: "*/1 * * * *"
  earliest_time: "-2m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 60

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | eval decoded_uri=lower(urldecode(uri))
  | where match(decoded_uri,"(;|\|\||&&|\$\(|`)(\s*)?(whoami|id|uname|cat|curl|wget|bash|sh|nc|python|perl)|/bin/(sh|bash)|cmd\.exe|powershell")
  | eval detection="Command Injection or RCE Attempt"
  | eval rule_id="MS-WEB-004"
  | eval severity="critical"
  | table _time rule_id detection severity src_ip method uri status user_agent

false_positives:
  - Authorized penetration testing
  - Approved red team activity
  - Development endpoints receiving shell syntax as legitimate text

investigation:
  - Review the full malicious request and command payload
  - Correlate the source IP with other exploit attempts
  - Review backend and container logs for unexpected command execution
  - Check for suspicious outbound connections or spawned processes

response:
  - Block confirmed malicious source addresses
  - Isolate the affected workload if command execution is confirmed
  - Rotate exposed credentials and secrets if compromise is suspected
  - Escalate confirmed remote code execution to incident response
