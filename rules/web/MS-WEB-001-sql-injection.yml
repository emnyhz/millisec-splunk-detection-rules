title: Advanced SQL Injection Detection
id: MS-WEB-001
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects potentially malicious SQL injection attempts against web
  applications by analyzing decoded HTTP request URIs for common SQL
  injection operators, database functions and query manipulation patterns.

severity: high

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Initial Access
  technique:
    - T1190
  technique_name:
    - Exploit Public-Facing Application

splunk:
  name: MilliSec - Advanced SQL Injection Detection
  schedule: "*/1 * * * *"
  earliest_time: "-2m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 60

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | eval decoded_uri=lower(urldecode(uri))
  | where match(decoded_uri,"union(\s+|%20)+select|information_schema|or(\s+|%20)+[0-9]+(\s*|%20)*(=|%3d)(\s*|%20)*[0-9]+|sleep\s*\(|benchmark\s*\(|load_file\s*\(|into(\s+|%20)+outfile")
  | eval detection="SQL Injection Attempt"
  | eval rule_id="MS-WEB-001"
  | eval severity="high"
  | table _time rule_id detection severity src_ip method uri status user_agent

false_positives:
  - Authorized penetration testing
  - Security scanning performed by approved internal teams

investigation:
  - Review the complete HTTP request and source IP address
  - Check for additional attack attempts from the same source
  - Correlate the source IP with authentication and reconnaissance events
  - Review application and backend logs for signs of successful exploitation

response:
  - Block confirmed malicious source addresses
  - Review affected application endpoints
  - Validate application input handling and parameterized queries
  - Escalate confirmed exploitation attempts to incident response
