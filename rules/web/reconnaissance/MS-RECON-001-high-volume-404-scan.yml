title: High-Volume Web Reconnaissance and 404 Enumeration Detection
id: MS-RECON-001
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Detects rapid enumeration of non-existent paths by identifying sources generating many HTTP 404 responses across numerous distinct URIs in a short time window.
severity: medium
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Discovery
  technique:
  - T1083
  technique_name:
  - File and Directory Discovery
splunk:
  name: MilliSec - High Volume Web Recon Detection
  schedule: '*/1 * * * *'
  earliest_time: -6m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 300
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | where status="404"
  | stats count as total_404 dc(uri) as unique_paths values(user_agent) as user_agents by src_ip
  | where total_404>=10 AND unique_paths>=7
  | eval detection="High-Volume Web Reconnaissance", rule_id="MS-RECON-001", severity="medium"
  | table rule_id detection severity src_ip total_404 unique_paths user_agents
false_positives:
- Broken application links after deployment
- Search-engine crawlers accessing stale paths
investigation:
- Review enumerated paths for sensitive targets
- Check user agents for scanning tools
- Correlate the source with exploit attempts
- Review source geolocation and reputation
response:
- Rate-limit aggressive scanners
- Block confirmed malicious reconnaissance sources
- Remove unnecessary public route information
- Monitor for follow-on exploitation
