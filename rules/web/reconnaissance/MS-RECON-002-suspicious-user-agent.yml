title: Suspicious Automated Scanner User-Agent Detection
id: MS-RECON-002
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Detects requests associated with common offensive-security scanners, scripted reconnaissance tools and suspicious or missing user-agent values, with thresholds to reduce noise.
severity: medium
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Reconnaissance
  technique:
  - T1595
  technique_name:
  - Active Scanning
splunk:
  name: MilliSec - Suspicious User Agent Detection
  schedule: '*/2 * * * *'
  earliest_time: -11m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 600
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | eval ua=lower(coalesce(user_agent,""))
  | where match(ua,"sqlmap|nikto|nmap|masscan|acunetix|nessus|nuclei|gobuster|dirbuster|ffuf|wpscan|python-requests|curl/") OR len(ua)=0
  | stats count as requests dc(uri) as unique_paths values(user_agent) as observed_user_agents by src_ip
  | where requests>=3
  | eval detection="Suspicious Automated Scanner User-Agent", rule_id="MS-RECON-002", severity="medium"
  | table rule_id detection severity src_ip requests unique_paths observed_user_agents
false_positives:
- Authorized vulnerability scanners
- Administrative scripts using curl or Python requests
investigation:
- Validate whether the source belongs to an approved scanner
- Review paths and response codes
- Correlate with exploit-pattern detections
- Assess scan duration and request frequency
response:
- Allowlist approved scanners where appropriate
- Rate-limit or block unauthorized scanners
- Monitor the source for exploitation
- Escalate repeated hostile reconnaissance
