title: Multi-Vector Web Attack Correlation
id: MS-ATTACK-001
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Correlates several distinct exploit classes from the same source within a short period. A source attempting multiple attack techniques is prioritized as high-risk activity.
severity: critical
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Reconnaissance
  - Initial Access
  - Execution
  technique:
  - T1595
  - T1190
  - T1059
  technique_name:
  - Active Scanning
  - Exploit Public-Facing Application
  - Command and Scripting Interpreter
splunk:
  name: MilliSec - Multi Vector Attack Correlation
  schedule: '*/1 * * * *'
  earliest_time: -11m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 600
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | eval u=lower(urldecode(uri))
  | eval technique=case(match(u,"union(\\s+|%20)+select|information_schema|sleep\\s*\\("),"SQLi",match(u,"<script|javascript:|onerror\\s*=|onload\\s*="),"XSS",match(u,"\\.\\./|/etc/passwd|%2e%2e"),"Path Traversal",match(u,"(;|\\|\\||&&|\\$\\(|`)(\\s*)?(whoami|id|uname|cat|curl|wget|bash|sh)"),"Command Injection",match(u,"169\\.254\\.169\\.254|latest/meta-data|127\\.0\\.0\\.1"),"SSRF",match(u,"/\\.env|/\\.git/|wp-config\\.php|backup\\.(zip|sql)"),"Sensitive File Scan",true(),"Other")
  | where technique!="Other"
  | stats count as total_events dc(technique) as distinct_techniques values(technique) as techniques values(uri) as sample_uris by src_ip
  | where distinct_techniques>=3
  | eval detection="Multi-Vector Web Attack", rule_id="MS-ATTACK-001", severity="critical"
  | table rule_id detection severity src_ip total_events distinct_techniques techniques sample_uris
false_positives:
- Approved penetration tests
- Comprehensive authorized vulnerability scanners
investigation:
- Review the sequence of distinct attack techniques
- Determine whether any request returned a successful response
- Correlate with authentication and backend events
- Assess source reputation and infrastructure ownership
response:
- Block confirmed hostile sources
- Escalate immediately for incident-response review
- Inspect targeted applications for compromise
- Preserve relevant logs and evidence
