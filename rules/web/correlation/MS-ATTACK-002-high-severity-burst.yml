title: High-Severity Attack Burst and Repeat Offender Detection
id: MS-ATTACK-002
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Identifies sources generating a rapid burst of high-risk web exploitation indicators. The rule combines exploit signatures and request volume to prioritize repeat offenders.
severity: critical
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Initial Access
  - Execution
  technique:
  - T1190
  - T1059
  technique_name:
  - Exploit Public-Facing Application
  - Command and Scripting Interpreter
splunk:
  name: MilliSec - High Severity Attack Burst
  schedule: '*/1 * * * *'
  earliest_time: -6m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 600
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | eval u=lower(urldecode(uri))
  | eval high_risk=if(match(u,"union(\\s+|%20)+select|information_schema|sleep\\s*\\(|<script|javascript:|\\.\\./|/etc/passwd|(;|\\|\\||&&|\\$\\(|`)(\\s*)?(whoami|id|uname|cat|curl|wget|bash|sh)|169\\.254\\.169\\.254|latest/meta-data"),1,0)
  | where high_risk=1
  | stats count as high_risk_events dc(uri) as unique_payloads min(_time) as first_seen max(_time) as last_seen values(uri) as sample_uris by src_ip
  | eval duration=last_seen-first_seen
  | where high_risk_events>=5 AND unique_payloads>=3
  | eval detection="High-Severity Attack Burst", rule_id="MS-ATTACK-002", severity="critical"
  | convert ctime(first_seen) ctime(last_seen)
  | table rule_id detection severity src_ip high_risk_events unique_payloads duration first_seen last_seen sample_uris
false_positives:
- Approved penetration testing
- Automated security validation exercises
investigation:
- Review the full sequence of high-risk payloads
- Identify whether the activity is automated
- Correlate with successful HTTP responses and backend activity
- Check whether the source previously triggered critical detections
response:
- Block confirmed malicious repeat offenders
- Escalate to incident response
- Review targeted services for exploitation evidence
- Increase monitoring for related infrastructure
