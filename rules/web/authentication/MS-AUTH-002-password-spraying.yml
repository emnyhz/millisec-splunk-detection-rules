title: Password Spraying Behavior Detection
id: MS-AUTH-002
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Detects low-and-slow authentication abuse by identifying repeated failed login attempts over a longer period, a pattern consistent with password spraying and rate-limit evasion.
severity: high
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Credential Access
  technique:
  - T1110.003
  technique_name:
  - Password Spraying
splunk:
  name: MilliSec - Password Spraying Detection
  schedule: '*/2 * * * *'
  earliest_time: -16m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 600
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | where like(uri,"/api/login%") AND status IN ("401","403")
  | stats count as failures min(_time) as first_seen max(_time) as last_seen by src_ip
  | eval duration=last_seen-first_seen
  | where failures>=6 AND duration>=60
  | eval detection="Password Spraying Behavior", rule_id="MS-AUTH-002", severity="high"
  | convert ctime(first_seen) ctime(last_seen)
  | table rule_id detection severity src_ip failures duration first_seen last_seen
false_positives:
- Users repeatedly entering outdated passwords
- Automated health checks using invalid test credentials
investigation:
- Review source reputation and geolocation
- Check whether successful authentication followed the failures
- Identify timing patterns consistent with automation
- Correlate with other attack types from the same source
response:
- Apply adaptive rate limiting
- Require MFA for targeted accounts
- Temporarily block abusive sources
- Review credentials for signs of compromise
