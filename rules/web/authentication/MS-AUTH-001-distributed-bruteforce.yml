title: Distributed Brute Force Authentication Detection
id: MS-AUTH-001
status: production
version: 1.0.0
author: Emin Yahyazadə
date: '2026-09-10'
description: Detects repeated failed authentication attempts against the MilliSec login endpoint, including concentrated attacks from one source and distributed activity across multiple sources.
severity: high
data_source:
  index: millisec_web
  sourcetype: nginx:docker
mitre_attack:
  tactic:
  - Credential Access
  technique:
  - T1110
  technique_name:
  - Brute Force
splunk:
  name: MilliSec - Distributed Brute Force Detection
  schedule: '*/1 * * * *'
  earliest_time: -6m
  latest_time: now
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 300
search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\\S+) - - \\[(?<request_time>[^\\]]+)\\] \\\"(?<method>\\S+) (?<uri>\\S+) (?<protocol>[^\\\"]+)\\\" (?<status>\\d{3}) (?<bytes>\\d+) \\\"(?<referer>[^\\\"]*)\\\" \\\"(?<user_agent>[^\\\"]*)\\\""
  | where like(uri,"/api/login%") AND status IN ("401","403")
  | bin _time span=5m
  | stats count as failures dc(src_ip) as distinct_sources values(src_ip) as source_ips by _time
  | where failures>=8 OR (failures>=5 AND distinct_sources>=3)
  | eval detection="Distributed Brute Force Authentication", rule_id="MS-AUTH-001", severity="high"
  | table _time rule_id detection severity failures distinct_sources source_ips
false_positives:
- Authentication load testing
- Multiple legitimate users behind shared NAT repeatedly failing login
investigation:
- Review failed-login volume and source distribution
- Correlate with successful login activity
- Check user-agent consistency and source geolocation
- Identify targeted accounts if application logs expose usernames
response:
- Rate-limit or temporarily block abusive sources
- Enforce MFA for affected accounts
- Reset credentials if compromise is suspected
- Escalate sustained distributed attacks
