title: Broken Access Control and Unauthorized API Access Detection
id: MS-ACCESS-001
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects repeated unauthorized or forbidden requests to sensitive MilliSec
  API endpoints. The rule focuses on protected user, profile, administrative
  and authorization-related routes that should not be accessible without
  valid permissions.

severity: high

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Collection
  technique:
    - T1213
  technique_name:
    - Data from Information Repositories

splunk:
  name: MilliSec - Broken Access Control Detection
  schedule: "*/1 * * * *"
  earliest_time: "-6m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 300

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | eval decoded_uri=lower(urldecode(uri))
  | where status IN ("401","403")
      AND match(decoded_uri,"^/api/(v1/)?(users|profile|admin|management|settings|roles|permissions)")
  | stats
      count as denied_requests
      dc(uri) as distinct_targets
      values(uri) as targeted_paths
      values(method) as methods
      by src_ip
  | where denied_requests>=3
  | eval detection="Broken Access Control or Unauthorized API Access"
  | eval rule_id="MS-ACCESS-001"
  | eval severity="high"
  | table rule_id detection severity src_ip denied_requests distinct_targets targeted_paths methods

false_positives:
  - Legitimate users with expired sessions
  - Misconfigured API clients
  - Authorized security testing against protected endpoints

investigation:
  - Review the protected endpoints targeted by the source IP
  - Check whether the requests were authenticated or anonymous
  - Correlate the activity with failed login attempts
  - Review whether the same source later received successful responses
  - Check for access attempts against administrative or privileged resources

response:
  - Revoke suspicious sessions or API tokens
  - Review RBAC and authorization middleware configuration
  - Block confirmed malicious source addresses
  - Investigate any successful access to protected resources
  - Escalate confirmed unauthorized data access
