title: High-Volume Web Reconnaissance and 404 Enumeration Detection
id: MS-RECON-001
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects aggressive web reconnaissance by identifying source IP addresses
  that generate a high number of HTTP 404 responses across multiple distinct
  application paths within a short period of time.

severity: medium

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Reconnaissance
  technique:
    - T1595
  technique_name:
    - Active Scanning

splunk:
  name: MilliSec - High Volume Web Recon Detection
  schedule: "*/1 * * * *"
  earliest_time: "-6m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 300

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | where status="404"
  | stats
      count as total_404
      dc(uri) as unique_paths
      values(uri) as sample_paths
      values(user_agent) as user_agents
      by src_ip
  | where total_404>=10 AND unique_paths>=7
  | eval detection="High-Volume Web Reconnaissance"
  | eval rule_id="MS-RECON-001"
  | eval severity="medium"
  | table rule_id detection severity src_ip total_404 unique_paths sample_paths user_agents

false_positives:
  - Search engine crawlers accessing obsolete application paths
  - Broken internal links after an application deployment
  - Authorized vulnerability scanning

investigation:
  - Review the sequence of requested paths
  - Identify whether administrative or sensitive resources were targeted
  - Check the user-agent for automated scanning tools
  - Correlate the source IP with exploitation attempts
  - Review source IP geolocation and reputation

response:
  - Apply rate limiting to aggressive scanners
  - Block confirmed malicious reconnaissance sources
  - Review public application routing and exposed resources
  - Monitor the same source for follow-on exploitation attempts
