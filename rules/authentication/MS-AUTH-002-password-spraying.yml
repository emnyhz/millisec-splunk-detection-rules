title: Password Spraying Behavior Detection
id: MS-AUTH-002
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects low-and-slow authentication abuse against the MilliSec login
  endpoint by identifying repeated failed login attempts distributed over
  a longer time window. This behavior may indicate password spraying or
  attempts to evade short-duration brute-force thresholds.

severity: high

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Credential Access
  technique:
    - T1110.003
  technique_name:
    - Password Spraying

splunk:
  name: MilliSec - Password Spraying Detection
  schedule: "*/2 * * * *"
  earliest_time: "-16m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 600

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | where like(uri,"/api/login%") AND status IN ("401","403")
  | bin _time span=2m
  | stats count as failures by _time src_ip
  | where failures>=1
  | stats
      sum(failures) as total_failures
      dc(_time) as active_intervals
      min(_time) as first_seen
      max(_time) as last_seen
      by src_ip
  | eval duration=last_seen-first_seen
  | where total_failures>=6 AND active_intervals>=3 AND duration>=240
  | eval detection="Password Spraying Behavior"
  | eval rule_id="MS-AUTH-002"
  | eval severity="high"
  | convert ctime(first_seen) ctime(last_seen)
  | table rule_id detection severity src_ip total_failures active_intervals duration first_seen last_seen

false_positives:
  - A legitimate user repeatedly entering an incorrect password
  - Automated applications using expired credentials
  - Authorized authentication security testing

investigation:
  - Review the timing pattern of failed authentication attempts
  - Check whether failures are intentionally spread across multiple intervals
  - Correlate the source IP with successful authentication events
  - Review source geolocation and reputation
  - Check for reconnaissance or exploitation activity from the same source

response:
  - Apply adaptive rate limiting to suspicious authentication sources
  - Require MFA for potentially targeted accounts
  - Temporarily block confirmed malicious sources
  - Review credentials for signs of compromise
  - Escalate sustained password spraying behavior
