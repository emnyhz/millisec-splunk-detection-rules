title: Successful Authentication After Multiple Failures
id: MS-AUTH-003
status: production
version: 1.0.0
author: Emin Yahyazadə
date: 2026-09-10

description: >
  Detects a successful authentication event that occurs after multiple
  failed login attempts from the same source IP within the monitoring
  window. This behavior may indicate successful credential guessing,
  brute-force compromise or unauthorized account access.

severity: critical

data_source:
  index: millisec_web
  sourcetype: nginx:docker

mitre_attack:
  tactic:
    - Credential Access
  technique:
    - T1110
  technique_name:
    - Brute Force

splunk:
  name: MilliSec - Successful Login After Multiple Failures
  schedule: "*/1 * * * *"
  earliest_time: "-11m"
  latest_time: "now"
  alert_type: number of events
  alert_comparator: greater than
  alert_threshold: 0
  throttle_seconds: 300

search: |
  index=millisec_web sourcetype="nginx:docker"
  | rex field=line "^(?<src_ip>\S+) - - \[(?<request_time>[^\]]+)\] \"(?<method>\S+) (?<uri>\S+) (?<protocol>[^\"]+)\" (?<status>\d{3}) (?<bytes>\d+) \"(?<referer>[^\"]*)\" \"(?<user_agent>[^\"]*)\""
  | where like(uri,"/api/login%")
  | eval failed=if(status IN ("401","403"),1,0)
  | eval success=if(status IN ("200","201","204"),1,0)
  | sort 0 src_ip _time
  | streamstats current=f sum(failed) as prior_failures by src_ip
  | where success=1 AND prior_failures>=5
  | eval detection="Successful Authentication After Multiple Failures"
  | eval rule_id="MS-AUTH-003"
  | eval severity="critical"
  | table _time rule_id detection severity src_ip prior_failures status uri user_agent

false_positives:
  - A legitimate user eventually entering the correct password
  - Authorized authentication testing
  - Automated applications recovering after credentials are corrected

investigation:
  - Confirm that the successful authentication occurred after the failures
  - Review the source IP address and its geolocation
  - Check activity performed immediately after the successful login
  - Correlate the source with brute-force and password spraying detections
  - Review access to sensitive or privileged API endpoints

response:
  - Revoke suspicious authenticated sessions
  - Require password reset and MFA verification for affected accounts
  - Block confirmed malicious source addresses
  - Review account activity for unauthorized access
  - Escalate suspected account compromise to incident response
